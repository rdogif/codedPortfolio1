<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StankySituations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,805;1,805&display=swap" rel="stylesheet">
</head>
<style>
    html {
        scrollbar-width: none;
    }
    ::-webkit-scrollbar{
        width: none;
    }
    body {
        
        background: linear-gradient(to right, green, rgb(23, 167, 64));
        user-select: none;
    }
    h1 {
        margin-top: 10px;
        font-size: 3em;
        overflow-wrap: break-word;
        background-image: linear-gradient(to bottom, rgb(255, 255, 255), rgb(71, 165, 71));
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-align: center;
        font-family: 'Archivo Black', sans-serif;
        
        filter: drop-shadow(2px 5px 5px black);
    }
    button {
        filter: drop-shadow(2px 5px 0px black);
        overflow-wrap: break-word;
        height: 200px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 4em;
        width: 500px;
        display: block;
        margin: 0 auto;
        box-shadow: inset 5px 5px 15px  rgb(255, 255, 255), inset -5px -5px 15px  rgb(0, 0, 0) ;
        border: none;
        background-color: rgb(32, 255, 58);
        cursor: pointer;
    }
    button:hover{
        background-color: rgb(48, 255, 82);
    }
    button:active {
        transform: translateX(2px) translateY(5px);
        filter: none;
    }
    div {
        background-color: rgb(47, 255, 57);
        overflow-y: scroll;
        font-size: 2em;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        text-align: center;
        outline: 2px solid rgb(5, 41, 8);
        width: 400px;
        height: 400px;
        display: block;
        margin: 100px auto;
    }



</style>
<body>
    <h1>Stanky Situation Generator</h1>
    <button id="button">Generate</button>
    <div id="genplace">Situation will generate here</div>

    <script>
let generated = false;
const button = document.getElementById("button");
const situation = document.getElementById("genplace");

button.addEventListener("click", async function() {
    if(!generated){
        generated = true;
situation.textContent = "generating...";
    const response = await fetch(
    "https://stanky-situations-api.rishaandasonly.workers.dev/"
);

const data = await response.json();

situation.textContent = data.situation;
generated = false;
    }
});

</script>


</body>



</html>
